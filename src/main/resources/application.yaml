spring:
  application:
    name: axentria-document-downloader

download:
  axentriaBaseUrl: "http://pyhmlw415/AxentriaCI"
  linksSelector: "a.list-group-item"
  directory: "/mnt/Downloads"
  s3:
    bucket: "${S3_BUCKET:}"
    prefix: "${S3_KEY_PREFIX:downloads/}"

management:
  endpoints:
    jmx:
      exposure:
        include: "health,info"